<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Міні-Месенджер та Гра</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .tabs {
            display: flex;
            background: #0f172a;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        .tab-content {
            display: none;
            padding: 20px;
            height: 400px;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* Чат */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.1);
        }

        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
        }

        .message.user {
            background: var(--accent);
            align-self: flex-end;
            margin-left: auto;
        }

        .message.bot {
            background: var(--border);
            align-self: flex-start;
        }

        .chat-input-box {
            display: flex;
            gap: 10px;
        }

        input, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        input {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-color);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* Гра */
        .game-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            gap: 15px;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
        }

        .click-btn {
            padding: 20px 40px;
            font-size: 20px;
            background: #10b981;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            cursor: pointer;
            border: none;
            color: white;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s;
        }

        .click-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chat')">💬 Міні-Чат</button>
            <button class="tab-btn" onclick="switchTab('game')">🎮 Міні-Гра</button>
        </div>

        <div id="chat" class="tab-content active">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">Привіт! Це твій міні-чат. Напиши щось!</div>
            </div>
            <div class="chat-input-box">
                <input type="text" id="messageInput" placeholder="Введіть повідомлення..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Надіслати</button>
            </div>
        </div>

        <div id="game" class="tab-content">
            <div class="game-container">
                <h2>Кліккер-Грушка 🍏</h2>
                <p>Тисни на кнопку якомога швидше!</p>
                <div class="score">Рахунок: <span id="scoreVal">0</span></div>
                <button class="click-btn" onclick="incrementScore()">ТИСНИ!</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const chatMessages = document.getElementById('chatMessages');

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = `Бот відповів на: "${text}"`;
                chatMessages.appendChild(botMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 500);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        let score = 0;
        function incrementScore() {
            score++;
            document.getElementById('scoreVal').textContent = score;
        }
    </script>
</body>
</html>
