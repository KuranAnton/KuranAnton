<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Міні-Месенджер та Гра з прокачками</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* Екран входу / реєстрації */
        .auth-screen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .auth-box h2 {
            margin: 0;
            color: var(--accent);
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-buttons button {
            flex: 1;
        }

        .btn-secondary {
            background: #64748b !important;
        }

        .auth-error {
            color: var(--danger);
            font-size: 13px;
            min-height: 18px;
        }

        /* Головний контейнер з табами */
        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Меню табів зверху */
        .nav-tabs {
            display: flex;
            background: #0b1329;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        /* Контент вкладки */
        .tab-pane {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
            background: var(--card-bg);
        }

        .tab-pane.active {
            display: flex;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--accent);
        }

        .user-badge {
            font-size: 12px;
            background: var(--border);
            padding: 4px 8px;
            border-radius: 20px;
        }

        .btn-logout {
            background: var(--danger);
            padding: 5px 10px;
            font-size: 11px;
        }

        /* Чат */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            word-break: break-word;
            font-size: 14px;
        }

        .message.remote {
            background: var(--border);
            align-self: flex-start;
        }

        .message.user {
            background: var(--accent);
            align-self: flex-end;
            margin-left: auto;
        }

        .msg-author {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .chat-input-box {
            display: flex;
            gap: 10px;
        }

        input, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        input {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-color);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* Гра та прокачки (адаптив під мобільні та ПК) */
        .game-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            .game-layout {
                flex-direction: row;
            }
        }

        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .score-board {
            font-size: 22px;
            font-weight: bold;
            color: var(--success);
        }

        .stats-info {
            font-size: 13px;
            opacity: 0.8;
            display: flex;
            gap: 15px;
        }

        .click-btn {
            padding: 15px;
            font-size: 18px;
            background: var(--success);
            border-radius: 50%;
            width: 120px;
            height: 120px;
            cursor: pointer;
            border: none;
            color: white;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s;
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        /* Блоки прокачок */
        .upgrades-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }

        .upgrade-info h4 {
            margin: 0 0 4px 0;
            font-size: 13px;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 11px;
            opacity: 0.7;
        }

        .upgrade-btn {
            background: var(--warning);
            padding: 8px 12px;
            font-size: 12px;
            white-space: nowrap;
        }

        .upgrade-btn:hover {
            background: #d97706;
        }

        .upgrade-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Лідерборд */
        .leaderboard-container {
            width: 100%;
            max-height: 200px;
            background: rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .leaderboard-container {
                width: 260px;
                max-height: none;
            }
        }

        .leaderboard-container h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
            font-size: 12px;
        }

        .leaderboard-item {
            padding: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Екран авторизації -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-box">
            <h2>🔐 Вхід / Реєстрація</h2>
            <p>Введіть логін та пароль:</p>
            <input type="text" id="loginInput" placeholder="Логін..." maxlength="15">
            <input type="password" id="passInput" placeholder="Пароль...">
            <div class="auth-buttons">
                <button onclick="handleLogin()">Увійти</button>
                <button onclick="handleRegister()" class="btn-secondary">Реєстрація</button>
            </div>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <!-- Основний додаток з табами -->
    <div id="appContainer" class="main-container hidden">
        <!-- Навігаційні вкладки зверху -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('chatTab', this)">💬 Онлайн Чат</button>
            <button class="tab-btn" onclick="switchTab('gameTab', this)">🎮 Міні-Гра</button>
        </div>

        <!-- Вкладка 1: Чат -->
        <div id="chatTab" class="tab-pane active">
            <div class="section-header">
                <h2>💬 Онлайн Чат</h2>
                <span id="currentUserDisplay" class="user-badge"></span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message remote">Завантаження повідомлень...</div>
            </div>
            <div class="chat-input-box">
                <input type="text" id="messageInput" placeholder="Введіть повідомлення..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Надіслати</button>
            </div>
        </div>

        <!-- Вкладка 2: Міні-Гра та Прокачки -->
        <div id="gameTab" class="tab-pane">
            <div class="section-header">
                <h2>🎮 Кліккер та Фарм</h2>
                <button onclick="logout()" class="btn-logout">Вийти</button>
            </div>
            
            <div class="game-layout">
                <div class="game-main">
                    <div class="score-board">Баланс: <span id="scoreVal">0.00</span> балів</div>
                    <div class="stats-info">
                        <span>Сила кліка: +<span id="powerVal">1</span></span>
                        <span>Дохід/хв: +<span id="passiveVal">0</span></span>
                    </div>
                    
                    <button class="click-btn" onclick="incrementScore()">ТИСНИ!</button>
                    
                    <div class="upgrades-container">
                        <!-- Прокачка кліка -->
                        <div class="upgrade-card">
                            <div class="upgrade-info">
                                <h4>⚡ Сила кліка (Рівень <span id="clickLevel">1</span>)</h4>
                                <p id="clickDesc">Наступний: +2 до кліка</p>
                            </div>
                            <button id="clickUpgradeBtn" class="upgrade-btn" onclick="buyClickUpgrade()">Купити за 50</button>
                        </div>

                        <!-- Прокачка пасивного доходу -->
                        <div class="upgrade-card">
                            <div class="upgrade-info">
                                <h4>⏳ Пасивний дохід (Рівень <span id="passiveLevel">0</span>)</h4>
                                <p id="passiveDesc">Наступний: +1 очко/хв</p>
                            </div>
                            <button id="passiveUpgradeBtn" class="upgrade-btn" onclick="buyPassiveUpgrade()">Купити за 50</button>
                        </div>
                    </div>
                </div>

                <div class="leaderboard-container">
                    <h3>🏆 Топ гравців</h3>
                    <ul class="leaderboard-list" id="leaderboardList">
                        <li class="leaderboard-item">Завантаження...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Логіка та Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://antonkuran-efcb8-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');
        const usersRef = ref(db, 'users');

        let currentUser = localStorage.getItem('chat_user');
        let userPassword = localStorage.getItem('chat_pass') || "";
        let userScore = 0;
        let clickPower = 1;
        let clickLevel = 1;
        let passiveLevel = 0; // 0 рівень = 0 очок/хв
        let lastActiveTime = Date.now();

        if (currentUser) {
            showApp();
        }

        window.handleRegister = async function() {
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!login || !pass) {
                errorDiv.textContent = "Введіть логін і пароль!";
                return;
            }

            try {
                errorDiv.textContent = "Реєстрація...";
                const userPathRef = ref(db, `users/${login}`);
                const snapshot = await get(userPathRef);
                
                if (snapshot.exists()) {
                    errorDiv.textContent = "Цей логін вже зайнятий!";
                    return;
                }

                await set(userPathRef, {
                    password: pass,
                    score: 0,
                    clickPower: 1,
                    clickLevel: 1,
                    passiveLevel: 0,
                    lastTime: Date.now()
                });

                localStorage.setItem('chat_user', login);
                localStorage.setItem('chat_pass', pass);
                currentUser = login;
                userPassword = pass;
                showApp();
            } catch (err) {
                errorDiv.textContent = "Помилка бази!";
                console.error(err);
            }
        }

        window.handleLogin = async function() {
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!login || !pass) {
                errorDiv.textContent = "Введіть логін і пароль!";
                return;
            }

            try {
                errorDiv.textContent = "Вхід...";
                const snapshot = await get(ref(db, `users/${login}`));
                
                if (!snapshot.exists()) {
                    errorDiv.textContent = "Користувача не знайдено!";
                    return;
                }

                const userData = snapshot.val();
                if (userData.password !== pass) {
                    errorDiv.textContent = "Невірний пароль!";
                    return;
                }

                localStorage.setItem('chat_user', login);
                localStorage.setItem('chat_pass', pass);
                currentUser = login;
                userPassword = pass;
                showApp();
            } catch (err) {
                errorDiv.textContent = "Помилка бази!";
                console.error(err);
            }
        }

        window.logout = function() {
            localStorage.removeItem('chat_user');
            localStorage.removeItem('chat_pass');
            location.reload();
        }

        function showApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('currentUserDisplay').textContent = `Гравець: ${currentUser}`;
            initGameAndChat();
        }

        function initGameAndChat() {
            const userRef = ref(db, `users/${currentUser}`);
            
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    userScore = data.score || 0;
                    clickPower = data.clickPower || 1;
                    clickLevel = data.clickLevel || 1;
                    passiveLevel = data.passiveLevel || 0;
                    lastActiveTime = data.lastTime || Date.now();

                    // Нарахування оффлайн фарму за час відсутності
                    if (passiveLevel > 0) {
                        const now = Date.now();
                        const diffMinutes = (now - lastActiveTime) / (1000 * 60);
                        if (diffMinutes > 0.5) {
                            const earned = diffMinutes * passiveLevel;
                            userScore += earned;
                        }
                    }
                    updateUI();
                    saveUserData();
                }
            });

            // Слухаємо дані користувача в реальному часі
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    userScore = data.score || 0;
                    clickPower = data.clickPower || 1;
                    clickLevel = data.clickLevel || 1;
                    passiveLevel = data.passiveLevel || 0;
                    updateUI();
                }
            });

            // Часовий цикл пасивного фарму (кожну секунду додаємо частку від хвилини)
            setInterval(() => {
                if (passiveLevel > 0) {
                    userScore += passiveLevel / 60; // додаємо щосекунди
                    saveUserData();
                }
            }, 1000);

            // Чат
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            onChildAdded(messagesRef, (snapshot) => {
                const data = snapshot.val();
                const msgDiv = document.createElement('div');
                const isMe = data.author === currentUser;
                msgDiv.className = isMe ? 'message user' : 'message remote';
                msgDiv.innerHTML = `<div class="msg-author">${data.author}</div><div>${data.text}</div>`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });

            // Топ гравців
            onValue(usersRef, (snapshot) => {
                const data = snapshot.val() || {};
                const list = document.getElementById('leaderboardList');
                list.innerHTML = '';

                const sorted = Object.entries(data)
                    .map(([name, info]) => ({ name, score: info.score || 0 }))
                    .sort((a, b) => b.score - a.score);

                if (sorted.length === 0) {
                    list.innerHTML = '<li class="leaderboard-item">Ще немає рекордів</li>';
                    return;
                }

                sorted.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'leaderboard-item';
                    li.innerHTML = `<span>${index + 1}. ${item.name}</span> <b>${item.score.toFixed(1)}</b>`;
                    list.appendChild(li);
                });
            });
        }

        function updateUI() {
            document.getElementById('scoreVal').textContent = userScore.toFixed(2);
            document.getElementById('powerVal').textContent = clickPower;
            document.getElementById('clickLevel').textContent = clickLevel;
            document.getElementById('passiveLevel').textContent = passiveLevel;
            document.getElementById('passiveVal').textContent = passiveLevel;

            // Розрахунок цін (ціна множиться на 2: 50 -> 100 -> 200 -> 400 і т.д.)
            const clickCost = 50 * Math.pow(2, clickLevel - 1);
            const passiveCost = 50 * Math.pow(2, passiveLevel);

            const nextClickPower = clickPower * 2;
            const nextPassiveIncome = passiveLevel + 1;

            document.getElementById('clickDesc').textContent = `Наступний: +${nextClickPower} до кліка`;
            document.getElementById('clickUpgradeBtn').textContent = `Купити за ${clickCost}`;
            document.getElementById('clickUpgradeBtn').disabled = userScore < clickCost;

            document.getElementById('passiveDesc').textContent = `Наступний: +${nextPassiveIncome} очок/хв`;
            document.getElementById('passiveUpgradeBtn').textContent = `Купити за ${passiveCost}`;
            document.getElementById('passiveUpgradeBtn').disabled = userScore < passiveCost;
        }

        window.incrementScore = function() {
            userScore += clickPower;
            saveUserData();
        }

        window.buyClickUpgrade = function() {
            const clickCost = 50 * Math.pow(2, clickLevel - 1);
            if (userScore >= clickCost) {
                userScore -= clickCost;
                clickLevel++;
                clickPower *= 2; // Сила множиться на 2
                saveUserData();
            }
        }

        window.buyPassiveUpgrade = function() {
            const passiveCost = 50 * Math.pow(2, passiveLevel);
            if (userScore >= passiveCost) {
                userScore -= passiveCost;
                passiveLevel++; // Рівень пасивки +1 (дає +1 очко за хв)
                saveUserData();
            }
        }

        function saveUserData() {
            set(ref(db, `users/${currentUser}`), {
                password: userPassword,
                score: parseFloat(userScore.toFixed(2)),
                clickPower: clickPower,
                clickLevel: clickLevel,
                passiveLevel: passiveLevel,
                lastTime: Date.now()
            });
        }

        // Перемикання табів (вкладок)
        window.switchTab = function(tabId, btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            push(messagesRef, {
                author: currentUser,
                text: text,
                timestamp: Date.now()
            });

            input.value = '';
        }

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
