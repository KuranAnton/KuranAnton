<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Міні-Месенджер та Гра з прокачкою</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* Екран входу / реєстрації */
        .auth-screen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .auth-box h2 {
            margin: 0;
            color: var(--accent);
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-buttons button {
            flex: 1;
        }

        .btn-secondary {
            background: #64748b !important;
        }

        .btn-secondary:hover {
            background: #475569 !important;
        }

        .auth-error {
            color: var(--danger);
            font-size: 13px;
            min-height: 18px;
        }

        /* Головний інтерфейс на весь екран */
        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            box-sizing: border-box;
        }

        .section {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            background: var(--card-bg);
        }

        .chat-section {
            border-right: 2px solid var(--border);
        }

        .game-section {
            background: #172033;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 20px;
            color: var(--accent);
        }

        .user-badge {
            font-size: 13px;
            background: var(--border);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .btn-logout {
            background: var(--danger);
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        /* Чат */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
            font-size: 14px;
        }

        .message.remote {
            background: var(--border);
            align-self: flex-start;
        }

        .message.user {
            background: var(--accent);
            align-self: flex-end;
            margin-left: auto;
        }

        .msg-author {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .chat-input-box {
            display: flex;
            gap: 10px;
        }

        input, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        input {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-color);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* Гра та прокачка */
        .game-content {
            flex: 1;
            display: flex;
            gap: 20px;
            overflow: hidden;
        }

        .game-panel {
            flex: 1.2;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 15px;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: var(--success);
        }

        .click-power-info {
            font-size: 14px;
            opacity: 0.8;
        }

        .click-btn {
            padding: 20px;
            font-size: 20px;
            background: var(--success);
            border-radius: 50%;
            width: 140px;
            height: 140px;
            cursor: pointer;
            border: none;
            color: white;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s;
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .upgrade-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .upgrade-box h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
        }

        .upgrade-box p {
            margin: 0 0 10px 0;
            font-size: 12px;
            opacity: 0.8;
        }

        .upgrade-btn {
            background: #f59e0b;
            width: 100%;
            padding: 8px;
        }

        .upgrade-btn:hover {
            background: #d97706;
        }

        .upgrade-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .leaderboard-panel {
            flex: 0.8;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .leaderboard-panel h3 {
            margin-top: 0;
            font-size: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
            font-size: 13px;
        }

        .leaderboard-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Екран авторизації -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-box">
            <h2>🔐 Вхід / Реєстрація</h2>
            <p>Введіть логін та пароль:</p>
            <input type="text" id="loginInput" placeholder="Логін..." maxlength="15">
            <input type="password" id="passInput" placeholder="Пароль...">
            <div class="auth-buttons">
                <button onclick="handleLogin()">Увійти</button>
                <button onclick="handleRegister()" class="btn-secondary">Реєстрація</button>
            </div>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <!-- Основний повноекранний додаток -->
    <div id="appContainer" class="main-container hidden">
        <!-- Ліва частина: Чат -->
        <div class="section chat-section">
            <div class="section-header">
                <h2>💬 Онлайн Чат</h2>
                <span id="currentUserDisplay" class="user-badge"></span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message remote">Завантаження повідомлень...</div>
            </div>
            <div class="chat-input-box">
                <input type="text" id="messageInput" placeholder="Введіть повідомлення..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Надіслати</button>
            </div>
        </div>

        <!-- Права частина: Гра та Прокачка -->
        <div class="section game-section">
            <div class="section-header">
                <h2>🎮 Кліккер-Грушка</h2>
                <button onclick="logout()" class="btn-logout">Вийти</button>
            </div>
            
            <div class="game-content">
                <div class="game-panel">
                    <div class="score">Баланс балів: <span id="scoreVal">0.00</span></div>
                    <div class="click-power-info">Сила кліка: +<span id="powerVal">0.1</span></div>
                    <button class="click-btn" onclick="incrementScore()">ТИСНИ!</button>
                    
                    <div class="upgrade-box">
                        <h3>⚡ Прокачка кліка (Рівень <span id="currentLevel">1</span>/10)</h3>
                        <p id="upgradeDesc">Наступний рівень дасть +0.1 до кліка</p>
                        <button id="upgradeBtn" class="upgrade-btn" onclick="buyUpgrade()">Купити за 200 балів</button>
                    </div>
                </div>

                <div class="leaderboard-panel">
                    <h3>🏆 Топ гравців</h3>
                    <ul class="leaderboard-list" id="leaderboardList">
                        <li class="leaderboard-item">Завантаження...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Логіка та Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://antonkuran-efcb8-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');
        const usersRef = ref(db, 'users');

        let currentUser = localStorage.getItem('chat_user');
        let userPassword = localStorage.getItem('chat_pass') || "";
        let userScore = 0;
        let userLevel = 1;
        let clickPower = 0.1;

        const upgradeCosts = [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800];

        if (currentUser) {
            showApp();
        }

        window.handleRegister = async function() {
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!login || !pass) {
                errorDiv.textContent = "Введіть логін і пароль!";
                return;
            }

            try {
                errorDiv.textContent = "Реєстрація...";
                const snapshot = await get(child(ref(db), `users/${login}`));
                if (snapshot.exists()) {
                    errorDiv.textContent = "Цей логін вже зайнятий!";
                    return;
                }

                await set(ref(db, `users/${login}`), {
                    password: pass,
                    score: 0,
                    level: 1,
                    power: 0.1
                });

                localStorage.setItem('chat_user', login);
                localStorage.setItem('chat_pass', pass);
                currentUser = login;
                userPassword = pass;
                showApp();
            } catch (err) {
                errorDiv.textContent = "Помилка зв'язку з базою!";
                console.error(err);
            }
        }

        window.handleLogin = async function() {
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!login || !pass) {
                errorDiv.textContent = "Введіть логін і пароль!";
                return;
            }

            try {
                errorDiv.textContent = "Вхід...";
                const snapshot = await get(child(ref(db), `users/${login}`));
                if (!snapshot.exists()) {
                    errorDiv.textContent = "Користувача не знайдено!";
                    return;
                }

                const userData = snapshot.val();
                if (userData.password !== pass) {
                    errorDiv.textContent = "Невірний пароль!";
                    return;
                }

                localStorage.setItem('chat_user', login);
                localStorage.setItem('chat_pass', pass);
                currentUser = login;
                userPassword = pass;
                showApp();
            } catch (err) {
                errorDiv.textContent = "Помилка зв'язку з базою!";
                console.error(err);
            }
        }

        window.logout = function() {
            localStorage.removeItem('chat_user');
            localStorage.removeItem('chat_pass');
            location.reload();
        }

        function showApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('currentUserDisplay').textContent = `Гравець: ${currentUser}`;
            initGameAndChat();
        }

        function initGameAndChat() {
            const userRef = ref(db, `users/${currentUser}`);
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    userScore = data.score || 0;
                    userLevel = data.level || 1;
                    clickPower = data.power || 0.1;
                    updateUI();
                }
            });

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            onChildAdded(messagesRef, (snapshot) => {
                const data = snapshot.val();
                const msgDiv = document.createElement('div');
                const isMe = data.author === currentUser;
                msgDiv.className = isMe ? 'message user' : 'message remote';
                msgDiv.innerHTML = `<div class="msg-author">${data.author}</div><div>${data.text}</div>`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });

            onValue(usersRef, (snapshot) => {
                const data = snapshot.val() || {};
                const list = document.getElementById('leaderboardList');
                list.innerHTML = '';

                const sorted = Object.entries(data)
                    .map(([name, info]) => ({ name, score: info.score || 0 }))
                    .sort((a, b) => b.score - a.score);

                if (sorted.length === 0) {
                    list.innerHTML = '<li class="leaderboard-item">Ще немає рекордів</li>';
                    return;
                }

                sorted.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'leaderboard-item';
                    li.innerHTML = `<span>${index + 1}. ${item.name}</span> <b>${item.score.toFixed(1)}</b>`;
                    list.appendChild(li);
                });
            });
        }

        function updateUI() {
            document.getElementById('scoreVal').textContent = userScore.toFixed(1);
            document.getElementById('powerVal').textContent = clickPower.toFixed(1);
            document.getElementById('currentLevel').textContent = userLevel;

            const upgradeBtn = document.getElementById('upgradeBtn');
            const upgradeDesc = document.getElementById('upgradeDesc');

            if (userLevel >= 10) {
                upgradeDesc.textContent = "Максимальний рівень досягнуто!";
                upgradeBtn.textContent = "Максимум";
                upgradeBtn.disabled = true;
            } else {
                const nextCost = upgradeCosts[userLevel];
                upgradeDesc.textContent = `Ціна наступного рівня (+0.1 до кліка): ${nextCost} балів`;
                upgradeBtn.textContent = `Купити за ${nextCost} балів`;
                upgradeBtn.disabled = userScore < nextCost;
            }
        }

        window.incrementScore = function() {
            userScore += clickPower;
            saveUserData();
        }

        window.buyUpgrade = function() {
            if (userLevel >= 10) return;
            const nextCost = upgradeCosts[userLevel];

            if (userScore >= nextCost) {
                userScore -= nextCost;
                userLevel++;
                clickPower = parseFloat((clickPower + 0.1).toFixed(1)); 
                saveUserData();
            }
        }

        function saveUserData() {
            set(ref(db, `users/${currentUser}`), {
                password: userPassword,
                score: parseFloat(userScore.toFixed(1)),
                level: userLevel,
                power: clickPower
            });
        }

        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            push(messagesRef, {
                author: currentUser,
                text: text,
                timestamp: Date.now()
            });

            input.value = '';
        }

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
